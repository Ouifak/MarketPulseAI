name: marketpulse-ai

services:

  kafka:
    image: apache/kafka:3.7.0
    container_name: mp-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: mp-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: mp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/bronze &&
      mc mb -p local/silver &&
      mc mb -p local/gold &&
      echo 'Buckets bronze / silver / gold créés.'
      "

  postgres-airflow:
    image: postgres:16
    container_name: mp-postgres-airflow
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}"]
      interval: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: src/airflow/Dockerfile
    container_name: mp-airflow-init
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__WEBSERVER__SECRET_KEY: "1234!"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DBT_S3_ENDPOINT: minio:9000

      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      STOCK_SYMBOLS: ${STOCK_SYMBOLS}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_TRADES: ${KAFKA_TOPIC_TRADES}
      CONSUMER_GROUP: ${CONSUMER_GROUP}

      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE}
      S3_BUCKET_SILVER: ${S3_BUCKET_SILVER}
      S3_BUCKET_GOLD: ${S3_BUCKET_GOLD}

      BATCH_SIZE: ${BATCH_SIZE}
      BATCH_TIMEOUT_S: ${BATCH_TIMEOUT_S}

    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Ouifak
      --lastname Admin
      --role Admin
      --email admin@example.com"

  airflow-webserver:
    build:
      context: .
      dockerfile: src/airflow/Dockerfile
    container_name: mp-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - ./warehouse/dbt/marketpulse_dbt:/opt/airflow/dbt
      - C:/Users/ouifa/.dbt:/opt/airflow/.dbt
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: src/airflow/Dockerfile
    container_name: mp-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - ./warehouse/dbt/marketpulse_dbt:/opt/airflow/dbt
      - C:/Users/ouifa/.dbt:/opt/airflow/.dbt
    command: scheduler

volumes:
  minio_data:
  airflow_pg_data: