[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpulse-ai"
version = "0.1.0"
description = "Pipeline de données de marché en temps réel avec ingestion Kafka, data lake MinIO et agents LangGraph"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]